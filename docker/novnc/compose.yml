services:
  xiaohongshu-mcp:
    image: ${XHS_NOVNC_IMAGE:-xpzouying/xiaohongshu-mcp:novnc}
    restart: unless-stopped
    shm_size: 1gb
    cap_drop:
      - ALL
    # 兼容宿主其他 UID 拥有的已有 data 目录，其余 capabilities 全部移除。
    cap_add:
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    environment:
      COOKIES_PATH: /app/data/cookies.json
      AUTH_TOKEN: ${AUTH_TOKEN:-}
      XHS_PROXY: ${XHS_PROXY:-}
      NOVNC_PORT: ${XHS_NOVNC_PORT:-6080}
      # 供 get_captcha_image 返回给调用方，用户验证时打开的 VNC 地址
      XHS_VNC_URL: ${XHS_VNC_URL:-}
      # VNC 桌面的 Basic Auth。密码留空则首次启动生成随机密码，
      # 显示在容器日志并写入数据目录 vnc_password.txt。
      XHS_VNC_USER: ${XHS_VNC_USER:-vnc}
      XHS_VNC_PASSWORD: ${XHS_VNC_PASSWORD:-}
    volumes:
      - ${XHS_DATA_DIR:-./data}:/app/data
      - ${XHS_MEDIA_DIR:-./images}:/app/images:ro
    ports:
      - "127.0.0.1:${XHS_MCP_PORT:-18060}:18060"
      # VNC 已加 Basic Auth，可对外绑定；如只本机用，改成 127.0.0.1。
      - "${XHS_VNC_BIND:-0.0.0.0}:${XHS_NOVNC_PORT:-6080}:6080"
